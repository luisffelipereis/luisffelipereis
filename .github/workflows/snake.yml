
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: luisffelipereis
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FCFC04&color_dots=%230D1117,%230D1117,%230048D6,%230048D6,%23FCFC04
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FCFC04&color_dots=%230D1117,%230D1117,%230048D6,%230048D6,%23FCFC04

      - name: Publish Snake Animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
